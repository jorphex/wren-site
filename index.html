<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wren is a calm desktop wallet and signing firewall for Ethereum."
    />
    <meta name="theme-color" content="#0e1210" />
    <title>Wren — Desktop wallet</title>
    <link rel="icon" href="assets/wren-mark.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="#top" aria-label="Wren home">
          <img src="assets/wren-mark.png" alt="" />
          <span>wren</span>
        </a>

        <p class="header-meta">Desktop EVM wallet</p>
      </header>

      <main id="top">
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-scene" aria-hidden="true">
            <img src="assets/wren-garden.png" alt="" />
          </div>

          <div class="hero-copy">
            <p class="eyebrow">A calmer Ethereum wallet</p>
            <h1 id="hero-title">wren</h1>
            <p class="intro">
              A desktop EVM wallet and signing firewall for browsers,
              native apps, and command-line tools.
            </p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
