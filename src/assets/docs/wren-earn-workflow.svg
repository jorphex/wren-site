<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="title description">
  <title id="title">Wren Earn workflow</title>
  <desc id="description">Each Earn step waits for review and signer confirmation. After confirmation, Resume queues the next step. Only unsubmitted steps can be retried.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#89958b" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#a68a61" />
    </marker>
    <style>
      .node { fill: #141a16; stroke: #3d493f; stroke-width: 1; }
      .decision { fill: #181711; stroke: #a68a61; stroke-width: 1.5; }
      .route { fill: none; stroke: #89958b; stroke-width: 1.5; marker-end: url(#arrow); }
      .authority { fill: none; stroke: #a68a61; stroke-width: 2; marker-end: url(#arrow-accent); }
      .branch { fill: none; stroke: #89958b; stroke-width: 1; stroke-dasharray: 4 4; marker-end: url(#arrow); }
      .label { fill: #f2f4ef; font: 600 13px Recursive, MainFont, sans-serif; text-anchor: middle; }
      .detail { fill: #a9b3aa; font: 400 10px Recursive, MainFont, sans-serif; text-anchor: middle; }
      .accent { fill: #f0dec0; }
    </style>
  </defs>

  <path class="authority" d="M 130 70 V 95" />
  <path class="route" d="M 130 151 V 176" />
  <path class="route" d="M 130 232 V 257" />
  <path class="authority" d="M 130 313 V 338" />
  <path class="route" d="M 230 366 H 320 V 45 H 230" />
  <path class="branch" d="M 30 123 H 12 V 430 H 30" />
  <path class="route" d="M 150 456 H 210" />

  <rect class="node" x="30" y="20" width="200" height="50" />
  <text class="label" x="130" y="50">Queued step</text>

  <rect class="decision" x="30" y="95" width="200" height="56" />
  <text class="label accent" x="130" y="128">Review in Wren</text>

  <rect class="node" x="30" y="176" width="200" height="56" />
  <text class="label" x="130" y="209">Confirm with signer</text>

  <rect class="node" x="30" y="257" width="200" height="56" />
  <text class="label" x="130" y="290">Confirmed</text>

  <rect class="decision" x="30" y="338" width="200" height="56" />
  <text class="label accent" x="130" y="371">Resume</text>

  <text class="detail" x="292" y="218">Next step</text>

  <rect class="node" x="30" y="430" width="120" height="52" />
  <text class="label" x="90" y="451">Error</text>
  <text class="detail" x="90" y="468">Before submission</text>

  <rect class="node" x="210" y="430" width="120" height="52" />
  <text class="label" x="270" y="451">Retry</text>
  <text class="detail" x="270" y="468">Unsubmitted only</text>
</svg>
