<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title description">
  <title id="title">How requests reach Wren</title>
  <desc id="description">Browser dapps use Wren Companion. Native apps connect directly. Wren reviews requests before the signer or network acts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#89958b" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#a68a61" />
    </marker>
    <style>
      .node { fill: #141a16; stroke: #3d493f; stroke-width: 1; }
      .decision { fill: #29231b; stroke: #a68a61; stroke-width: 1.5; }
      .route { fill: none; stroke: #89958b; stroke-width: 1.5; marker-end: url(#arrow); }
      .authority { fill: none; stroke: #a68a61; stroke-width: 2; marker-end: url(#arrow-accent); }
      .label { fill: #f2f4ef; font: 600 13px Recursive, MainFont, sans-serif; text-anchor: middle; }
      .detail { fill: #a9b3aa; font: 400 10px Recursive, MainFont, sans-serif; text-anchor: middle; }
      .accent { fill: #b79a70; }
    </style>
  </defs>

  <path class="route" d="M 70 70 V 112" />
  <path class="route" d="M 70 174 V 205 H 130 V 212" />
  <path class="route" d="M 290 70 V 205 H 230 V 212" />
  <path class="authority" d="M 180 277 V 307" />
  <path class="route" d="M 180 366 V 390 H 85 V 410" />
  <path class="route" d="M 180 366 V 390 H 275 V 410" />

  <rect class="node" x="20" y="20" width="100" height="50" />
  <text class="label" x="70" y="50">Browser dapp</text>

  <rect class="node" x="240" y="20" width="100" height="50" />
  <text class="label" x="290" y="50">Native app</text>

  <rect class="node" x="20" y="112" width="100" height="62" />
  <text class="label" x="70" y="140">Companion</text>
  <text class="detail" x="70" y="157">Requests only</text>

  <rect class="node" x="80" y="212" width="200" height="65" />
  <text class="label" x="180" y="240">Wren desktop</text>
  <text class="detail" x="180" y="258">Permissions and request context</text>

  <rect class="decision" x="100" y="307" width="160" height="59" />
  <text class="label accent" x="180" y="342">Review and approve</text>

  <rect class="node" x="30" y="410" width="110" height="50" />
  <text class="label" x="85" y="440">Signer</text>

  <rect class="node" x="220" y="410" width="110" height="50" />
  <text class="label" x="275" y="440">Network RPC</text>
</svg>
